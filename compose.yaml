
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learning_journal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database_setup.sql:/docker-entrypoint-initdb.d/database_setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_journal"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: learningsteps-api:1.0
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/learning_journal
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
